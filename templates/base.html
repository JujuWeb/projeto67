<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
   <title> {% block titulo %} 67GAMES {% endblock %} </title>
</head>
<body>

    <header>
        <img src="/static/assets/LogoAnimada.gif" alt="Logo 67GAMES" class="gif">

        <a href="">
            <img src="static/assets/favoritos.png" alt="Jogos favoritos" class="icon">
        </a>

        <a href="{{ url_for('jogos.criar_jogo') }}">
            <img src="static/assets/cadastrarjogo.png" alt="Cadastrar Jogo" class="icon">
        </a>

        <a href="">
            <img src="static/assets/perfil.png" alt="Perfil" class="icon">
        </a>
        
        <a href="{{ url_for('auth.logout') }}">
            <img src="static/assets/sair.png" alt="Sair" class="icon">
        </a>
    </header>

    <nav>

    <div class="filtros">
        <a href="{{ url_for('jogos.inicio') }}">Todos</a>

        {% for categoria in categorias %}
            <a href="{{ url_for('jogos.inicio', categoria=categoria.id) }}">{{ categoria.nome }}</a>
        {% endfor %}
    </div>
    </nav>

    <main>
        <div class="bloco">
        {% block conteudo %}

         67GAMES 

        {% endblock %}
        </div>
    </main>
    <footer>
         &copy; COPYRIGHT 2026 - 67GAMES. TODOS OS DIREITOS RESERVADOS. <img src="/static/assets/67.png" alt="67GAMES" class="logofooter">
    </footer>
</body>
</html>
